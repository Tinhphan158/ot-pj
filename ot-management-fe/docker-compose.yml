services:
  web:
    build:
      context: .
      args:
        # Baked into the browser bundle at build time. Point this at wherever the
        # backend API is reachable FROM THE BROWSER (default: BE on the host).
        NEXT_PUBLIC_BACKEND_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_APP_URL: http://localhost:3002
    container_name: ot_management_web
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
