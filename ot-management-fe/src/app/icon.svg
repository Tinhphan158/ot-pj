<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Same mark as SidebarBrand: a rounded primary square with the lucide Clock glyph.
       Colors are literal because SVG favicons can't read the app's CSS variables —
       #2d5ed4 is --primary (oklch(0.52 0.19 264)) and #fafbfe is --primary-foreground. -->
  <rect width="32" height="32" rx="10.5" fill="#2d5ed4" />
  <g
    transform="translate(6.5 6.5) scale(0.79167)"
    fill="none"
    stroke="#fafbfe"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 6v6l4 2" />
    <circle cx="12" cy="12" r="10" />
  </g>
</svg>
